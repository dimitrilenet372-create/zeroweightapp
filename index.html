<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZERO WEIGHT — Bodyweight Training</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header>
    <div class="logo">ZERO<span>WEIGHT</span></div>
    <div class="header-actions">
      <div class="icon-btn" onclick="openNewWorkout()" title="Nouveau programme">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="icon-btn" title="Profil">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('programmes', this)">Programmes</button>
    <button class="tab"        onclick="switchTab('exercices', this)">Exercices</button>
    <button class="tab"        onclick="switchTab('historique', this)">Historique</button>
  </div>

  <!-- PROGRAMMES -->
  <div id="view-programmes" class="view active">
    <div id="workout-list"></div>
    <div class="add-card" onclick="openNewWorkout()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Créer un nouveau programme
    </div>
  </div>

  <!-- EXERCICES -->
  <div id="view-exercices" class="view">
    <div class="search-bar">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="exo-search" placeholder="Rechercher un exercice..." oninput="filterExercices(this.value)">
    </div>
    <div class="filter-chips" id="muscle-filter-chips"></div>
    <div id="exo-list"></div>
  </div>

  <!-- HISTORIQUE -->
  <div id="view-historique" class="view">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Séances</div>
        <div class="stat-value" id="stat-sessions">0</div>
        <div class="stat-sub">ce mois-ci</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Streak</div>
        <div class="stat-value" id="stat-streak">0<span>j</span></div>
        <div class="stat-sub">consécutifs</div>
      </div>
      <div class="stat-card full">
        <div class="stat-label">7 derniers jours</div>
        <div class="streak-row" id="streak-row"></div>
      </div>
    </div>
    <div class="section-title">DERNIÈRES SÉANCES</div>
    <div id="history-list"></div>
  </div>

</div>

<!-- ACTIVE BAR -->
<div class="active-workout-bar" id="active-bar" onclick="openActiveSession()">
  <div class="active-bar-inner">
    <div class="active-bar-dot"></div>
    <div class="active-bar-info">
      <div class="active-bar-name" id="active-bar-name">Séance en cours</div>
      <div class="active-bar-exo"  id="active-bar-exo">Tap pour reprendre</div>
    </div>
    <div class="active-bar-time" id="active-bar-time">0:00</div>
  </div>
</div>

<!-- MODAL: PREVIEW EXERCICE -->
<div class="modal-overlay" id="modal-preview">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="preview-media-wrap"></div>
    <div style="padding:4px 0 0">
      <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px" id="preview-muscle"></div>
      <div class="modal-title" id="preview-title" style="margin-bottom:6px"></div>
      <div id="preview-tags" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"></div>
      <p id="preview-desc" style="font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px"></p>
    </div>
    <div class="modal-actions">
      <!-- Bouton retour picker (visible seulement depuis le picker) -->
      <button class="btn-cancel" id="preview-back-btn" onclick="closePreviewBackToPicker()" style="display:none">← Retour</button>
      <!-- Bouton fermer (visible depuis onglet exercices) -->
      <button class="btn-cancel" id="preview-standalone-btn" onclick="closePreview()">Fermer</button>
      <!-- Bouton ajouter -->
      <button class="btn-save" id="preview-add-btn" onclick="addExoFromPreview()">+ AJOUTER</button>
    </div>
  </div>
</div>

<!-- MODAL: NOUVEAU PROGRAMME -->
<div class="modal-overlay" id="modal-workout">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-workout-title">NOUVEAU PROGRAMME</div>
    <div class="form-group">
      <label class="form-label">Nom du programme</label>
      <input type="text" class="form-input" id="input-workout-name" placeholder="ex: Full Body Poids de Corps">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Jours / sem.</label>
        <input type="number" class="form-input" id="input-workout-days" placeholder="3" min="1" max="7">
      </div>
      <div class="form-group">
        <label class="form-label">Durée (min)</label>
        <input type="number" class="form-input" id="input-workout-duration" placeholder="45" min="5">
      </div>
    </div>
    <div>
      <div class="section-title" style="margin-bottom:12px">EXERCICES</div>
      <div id="workout-exo-picker" style="max-height:220px;overflow-y:auto;margin-bottom:10px"></div>
      <div class="add-card" style="padding:12px;border-radius:12px" onclick="switchToExoPickerMode()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter un exercice
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-workout')">Annuler</button>
      <button class="btn-save"   onclick="saveWorkout()">SAUVEGARDER</button>
    </div>
  </div>
</div>

<!-- MODAL: EXO PICKER -->
<div class="modal-overlay" id="modal-exo-picker">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">CHOISIR UN EXERCICE</div>
    <div class="search-bar" style="margin-bottom:12px">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="picker-search" placeholder="Rechercher..." oninput="filterPickerExos(this.value)">
    </div>
    <div id="picker-exo-list" style="max-height:60vh;overflow-y:auto"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-exo-picker'); openModal('modal-workout')">← Retour</button>
    </div>
  </div>
</div>

<!-- MODAL: SESSION -->
<div class="modal-overlay" id="modal-session">
  <div class="modal" style="max-height:95vh">
    <div class="modal-handle"></div>
    <div class="session-header">
      <div class="session-header-left">
        <div class="modal-title" id="session-title" style="margin-bottom:4px">SÉANCE</div>
        <div class="session-progress-text" id="session-progress">0/0 exercices</div>
      </div>
      <div class="session-header-right">
        <div class="session-timer-display" id="session-timer">0:00</div>
      </div>
    </div>
    <div class="session-progress-bar-wrap">
      <div class="session-progress-bar-fill" id="session-progress-bar" style="width:0%"></div>
    </div>
    <div id="session-exo-list" style="overflow-y:auto;max-height:60vh;padding-right:2px"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
